backend:
  name: turbo-github
  turbo_site_id: 7c81888e-579c-4ea5-b24b-751aa9e5d890
  branch: main

site_url: https://enggarnanto.github.io/webportofolio/
display_url: https://enggarnanto.github.io/webportofolio/
logo:
  src: https://enggarnanto.github.io/webportofolio/favicon.svg
  show_in_header: true

locale: id
publish_mode: simple
local_backend: true

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: projects
    label: Project
    label_singular: Project
    description: Tambah dan kelola project yang tampil pada portofolio.
    folder: src/content/projects
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "projects/{{slug}}/"
    summary: "{{title}} — {{category}}"
    sortable_fields: [startDate, title, category]
    view_groups:
      - label: Kategori
        field: category
    fields:
      - label: Judul
        name: title
        widget: string
      - label: Deskripsi singkat
        name: description
        widget: text
        hint: Ringkasan yang tampil pada kartu project dan metadata halaman.
      - label: Waktu mulai
        name: startDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: Waktu selesai
        name: endDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        required: false
        hint: Kosongkan jika project masih berjalan.
      - label: Kategori
        name: category
        widget: select
        options: [Social Media, Content Production, Video Content, Public Relations, Lainnya]
      - label: Keahlian dan perangkat
        name: technologies
        widget: list
        allow_add: true
        collapsed: false
        field:
          label: Keahlian atau perangkat
          name: technology
          widget: string
      - label: Tampilkan di beranda
        name: featured
        widget: boolean
        default: false
      - label: Status
        name: status
        widget: select
        options: [Konsep, Berjalan, Selesai]
        default: Selesai
      - label: Peran
        name: role
        widget: string
        default: Content Strategy & Production
      - label: Warna aksen
        name: accent
        widget: select
        options:
          - { label: Lime, value: lime }
          - { label: Oranye, value: orange }
          - { label: Violet, value: violet }
          - { label: Biru, value: blue }
        default: lime
      - label: Gambar sampul
        name: cover
        widget: image
        required: false
        hint: Disarankan rasio 4:3 dengan format WebP atau JPEG.
      - label: Galeri karya
        name: gallery
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.caption}}"
        fields:
          - { label: Gambar, name: image, widget: image }
          - { label: Teks alternatif, name: alt, widget: string }
          - { label: Keterangan, name: caption, widget: string, required: false }
      - label: Video karya
        name: videos
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.title}}"
        fields:
          - { label: Video MP4, name: video, widget: file }
          - { label: Poster, name: poster, widget: image, required: false }
          - { label: Judul, name: title, widget: string }
      - label: Materi iklan
        name: ads
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.title}} — {{fields.platform}}"
        hint: Bagian iklan hanya tampil di halaman project jika daftar ini diisi.
        fields:
          - { label: Gambar iklan, name: image, widget: image }
          - { label: Teks alternatif, name: alt, widget: string }
          - { label: Judul iklan, name: title, widget: string }
          - { label: Platform, name: platform, widget: string, required: false, hint: Contoh Meta Ads atau Google Ads. }
          - { label: Keterangan atau hasil, name: caption, widget: text, required: false }
          - { label: URL iklan, name: url, widget: string, required: false }
      - label: Folder galeri teroptimasi
        name: galleryFolder
        widget: string
        required: false
        hint: Pengaturan internal untuk galeri aset yang sudah diproses.
      - label: Jumlah karya teroptimasi
        name: galleryCount
        widget: number
        value_type: int
        min: 0
        default: 0
        required: false
      - label: Teks alternatif galeri
        name: galleryAlt
        widget: string
        required: false
      - label: URL demo
        name: demo
        widget: string
        required: false
      - label: URL GitHub
        name: github
        widget: string
        required: false
      - label: Isi project
        name: body
        widget: markdown
